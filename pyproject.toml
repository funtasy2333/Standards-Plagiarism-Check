[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "std-plagiarism-check"
version = "0.1.0"
description = "Agent plugin (Skill + CLI + MCP Server) for checking group standard technical content duplication per Appendix B using remote OCR (DeepSeek OCR / Baidu PaddleOCR)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Standards Plagiarism Check Contributors" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "mcp>=1.2.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.2",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "respx>=0.21.1",
]

[project.scripts]
std-check = "std_plagiarism_check.cli:app"
std-check-mcp = "std_plagiarism_check.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/std_plagiarism_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
